bioyond_dispensing_station:
  category:
  - workstation
  - bioyond
  - bioyond_dispensing_station
  class:
    action_value_mappings:
      batch_create_90_10_vial_feeding_tasks:
        type: UniLabJsonCommand
        goal:
          delay_time: delay_time
          hold_m_name: hold_m_name
          liquid_material_name: liquid_material_name
          speed: speed
          temperature: temperature
          titration: titration
        feedback: {}
        result: {}
        schema:
          title: batch_create_90_10_vial_feeding_tasks参数
          description: 批量创建90%10%小瓶投料任务。从计算节点接收titration数据,包含物料名称、主称固体质量、滴定固体质量和滴定溶剂体积。返回的return_info中包含order_codes和order_ids列表。
          type: object
          properties:
            goal:
              type: object
              properties:
                titration:
                  type: string
                  title: 滴定信息
                  description: 滴定信息对象，包含 name(物料名称)、main_portion(主称固体质量g)、titration_portion(滴定固体质量g)、titration_solvent(滴定溶液体积mL)，通常由
                    compute_experiment_design 连线传入
                liquid_material_name:
                  type: string
                  default: NMP
                  title: 10%部分溶剂名称
                  description: 10%物料的液体物料名称，默认为"NMP"
                speed:
                  type: string
                  title: 搅拌速度(rpm)
                  description: 搅拌速度（rpm），不填则默认400
                temperature:
                  type: string
                  title: 搅拌温度(℃)
                  description: 搅拌温度（℃），不填则默认40
                delay_time:
                  type: string
                  title: 搅拌时间(s)
                  description: 搅拌时间（s），默认600s
                hold_m_name:
                  type: string
                  title: 6孔板库位名称
                  description: 6孔板库位名称，如"C01"，必填
              required:
              - titration
              title: BatchCreate9010VialFeedingTasks_Goal
            feedback:
              title: BatchCreate9010VialFeedingTasks_Feedback
            result:
              type: string
              title: BatchCreate9010VialFeedingTasks_Result
          required:
          - goal
        goal_default:
          titration: null
          liquid_material_name: NMP
          speed: null
          temperature: null
          delay_time: null
          hold_m_name: null
        handles:
          input:
          - data_key: titration
            data_source: handle
            data_type: object
            handler_key: titration
            io_type: source
            label: 滴定信息（来自「计算实验设计」）
          output:
          - data_key: return_info
            data_source: executor
            data_type: string
            handler_key: BATCH_CREATE_RESULT
            io_type: sink
            label: 批量任务结果（→「等待任务完成并获取报告」）
        placeholder_keys: {}
        display_name: 批量90%10%小瓶投料
      batch_create_diamine_solution_tasks:
        type: UniLabJsonCommand
        goal:
          delay_time: delay_time
          liquid_material_name: liquid_material_name
          solutions: solutions
          speed: speed
          temperature: temperature
        feedback: {}
        result: {}
        schema:
          title: batch_create_diamine_solution_tasks参数
          description: 批量创建二胺溶液配置任务。自动为多个二胺样品创建溶液配置任务，每个任务包含固体物料称量、溶剂添加、搅拌混合等步骤。返回的return_info中包含order_codes和order_ids列表。
          type: object
          properties:
            goal:
              type: object
              properties:
                solutions:
                  type: string
                  title: 溶液列表
                  description: 溶液列表，JSON数组格式，每个元素包含 name(物料名称)、order(序号)、solid_mass(固体质量g)、solvent_volume(溶剂体积mL)，通常由
                    compute_experiment_design 连线传入
                liquid_material_name:
                  type: string
                  default: NMP
                  title: 溶剂名称
                  description: 液体溶剂名称，用于溶解固体物料，默认为NMP（N-甲基吡咯烷酮）
                speed:
                  type: string
                  title: 搅拌速度(rpm)
                  description: 搅拌速度（rpm），用于混合溶液，不填则默认400转/分钟
                temperature:
                  type: string
                  title: 搅拌温度(℃)
                  description: 搅拌温度（℃），不填则默认20℃（室温）
                delay_time:
                  type: string
                  title: 搅拌时间(s)
                  description: 搅拌时间（s），默认600s
              required:
              - solutions
              title: BatchCreateDiamineSolutionTasks_Goal
            feedback:
              title: BatchCreateDiamineSolutionTasks_Feedback
            result:
              type: string
              title: BatchCreateDiamineSolutionTasks_Result
          required:
          - goal
        goal_default:
          solutions: null
          liquid_material_name: NMP
          speed: null
          temperature: null
          delay_time: null
        handles:
          input:
          - data_key: solutions
            data_source: handle
            data_type: array
            handler_key: solutions
            io_type: source
            label: 溶液列表（来自「计算实验设计」）
          output:
          - data_key: return_info
            data_source: executor
            data_type: string
            handler_key: BATCH_CREATE_RESULT
            io_type: sink
            label: 批量任务结果（→「等待任务完成并获取报告」）
        placeholder_keys: {}
        display_name: 批量二胺配液
      compute_experiment_design:
        type: UniLabJsonCommand
        goal:
          m_tot: m_tot
          ratio: ratio
          titration_percent: titration_percent
          wt_percent: wt_percent
        feedback: {}
        result: {}
        schema:
          title: compute_experiment_design参数
          description: 计算实验设计，输出solutions/titration/solvents/feeding_order用于后续节点。
          type: object
          properties:
            goal:
              type: object
              properties:
                ratio:
                  type: object
                  title: 组分摩尔比
                  description: 组分摩尔比的对象，保持输入顺序，如{"MDA":1,"BTDA":1}
                wt_percent:
                  type: string
                  default: '0.25'
                  title: 目标固含量
                  description: 目标固含质量分数，如 0.25
                m_tot:
                  type: string
                  default: '70'
                  title: 总质量(g)
                  description: 反应混合物总质量(g)
                titration_percent:
                  type: string
                  default: '0.03'
                  title: 滴定比例
                  description: 滴定比例(10%部分)，如 0.03
              required:
              - ratio
            feedback: {}
            result:
              properties:
                solutions:
                  items: {}
                  title: Solutions
                  type: array
                titration:
                  additionalProperties: true
                  title: Titration
                  type: object
                solvents:
                  additionalProperties: true
                  title: Solvents
                  type: object
                feeding_order:
                  items: {}
                  title: Feeding Order
                  type: array
                return_info:
                  title: Return Info
                  type: string
              required:
              - solutions
              - titration
              - solvents
              - feeding_order
              - return_info
              title: ComputeExperimentDesignReturn
              type: object
          required:
          - goal
        goal_default:
          ratio: null
          wt_percent: '0.25'
          m_tot: '70'
          titration_percent: '0.03'
        handles:
          output:
          - data_key: solutions
            data_source: executor
            data_type: array
            handler_key: solutions
            io_type: sink
            label: 溶液列表（→「批量二胺配液」）
          - data_key: titration
            data_source: executor
            data_type: object
            handler_key: titration
            io_type: sink
            label: 滴定信息（→「批量90%10%小瓶投料」）
          - data_key: solvents
            data_source: executor
            data_type: object
            handler_key: solvents
            io_type: sink
            label: 溶剂信息（→反应站「液体进料-溶剂」）
          - data_key: feeding_order
            data_source: executor
            data_type: array
            handler_key: feeding_order
            io_type: sink
            label: 投料顺序（→反应站「【配液联动】液体进料(滴定)」）
        placeholder_keys: {}
        display_name: 计算实验设计
      create_90_10_vial_feeding_task:
        type: DispenStationVialFeed
        goal:
          order_name: order_name
          percent_90_1_assign_material_name: percent_90_1_assign_material_name
          percent_90_1_target_weigh: percent_90_1_target_weigh
          percent_90_2_assign_material_name: percent_90_2_assign_material_name
          percent_90_2_target_weigh: percent_90_2_target_weigh
          percent_90_3_assign_material_name: percent_90_3_assign_material_name
          percent_90_3_target_weigh: percent_90_3_target_weigh
          percent_10_1_assign_material_name: percent_10_1_assign_material_name
          percent_10_1_target_weigh: percent_10_1_target_weigh
          percent_10_1_volume: percent_10_1_volume
          percent_10_1_liquid_material_name: percent_10_1_liquid_material_name
          percent_10_2_assign_material_name: percent_10_2_assign_material_name
          percent_10_2_target_weigh: percent_10_2_target_weigh
          percent_10_2_volume: percent_10_2_volume
          percent_10_2_liquid_material_name: percent_10_2_liquid_material_name
          percent_10_3_assign_material_name: percent_10_3_assign_material_name
          percent_10_3_target_weigh: percent_10_3_target_weigh
          percent_10_3_volume: percent_10_3_volume
          percent_10_3_liquid_material_name: percent_10_3_liquid_material_name
          speed: speed
          temperature: temperature
          delay_time: delay_time
          hold_m_name: hold_m_name
        feedback: {}
        result:
          return_info: return_info
        schema:
          title: DispenStationVialFeed
          description: 创建单个90%10%小瓶投料任务：最多3种90%固体物料和3种10%物料（固体+溶剂），不用的物料留空。批量投料请用
            batch_create_90_10_vial_feeding_tasks
          type: object
          properties:
            goal:
              type: object
              additionalProperties: false
              properties:
                order_name:
                  type: string
                  title: 任务名称
                  description: 任务名称，不填则使用默认名称
                percent_90_1_assign_material_name:
                  type: string
                  title: 90%物料1-名称
                  description: 90%部分第1种固体物料名称，不用则留空
                percent_90_1_target_weigh:
                  type: string
                  title: 90%物料1-重量(g)
                  description: 90%部分第1种固体物料目标重量（g）
                percent_90_2_assign_material_name:
                  type: string
                  title: 90%物料2-名称
                  description: 90%部分第2种固体物料名称，不用则留空
                percent_90_2_target_weigh:
                  type: string
                  title: 90%物料2-重量(g)
                  description: 90%部分第2种固体物料目标重量（g）
                percent_90_3_assign_material_name:
                  type: string
                  title: 90%物料3-名称
                  description: 90%部分第3种固体物料名称，不用则留空
                percent_90_3_target_weigh:
                  type: string
                  title: 90%物料3-重量(g)
                  description: 90%部分第3种固体物料目标重量（g）
                percent_10_1_assign_material_name:
                  type: string
                  title: 10%物料1-固体名称
                  description: 10%部分第1种固体物料名称，不用则留空
                percent_10_1_target_weigh:
                  type: string
                  title: 10%物料1-固体重量(g)
                  description: 10%部分第1种固体物料目标重量（g）
                percent_10_1_volume:
                  type: string
                  title: 10%物料1-溶剂体积(mL)
                  description: 10%部分第1种物料的溶剂体积（mL）
                percent_10_1_liquid_material_name:
                  type: string
                  title: 10%物料1-溶剂名称
                  description: 10%部分第1种物料的溶剂名称，如 NMP
                percent_10_2_assign_material_name:
                  type: string
                  title: 10%物料2-固体名称
                  description: 10%部分第2种固体物料名称，不用则留空
                percent_10_2_target_weigh:
                  type: string
                  title: 10%物料2-固体重量(g)
                  description: 10%部分第2种固体物料目标重量（g）
                percent_10_2_volume:
                  type: string
                  title: 10%物料2-溶剂体积(mL)
                  description: 10%部分第2种物料的溶剂体积（mL）
                percent_10_2_liquid_material_name:
                  type: string
                  title: 10%物料2-溶剂名称
                  description: 10%部分第2种物料的溶剂名称，如 NMP
                percent_10_3_assign_material_name:
                  type: string
                  title: 10%物料3-固体名称
                  description: 10%部分第3种固体物料名称，不用则留空
                percent_10_3_target_weigh:
                  type: string
                  title: 10%物料3-固体重量(g)
                  description: 10%部分第3种固体物料目标重量（g）
                percent_10_3_volume:
                  type: string
                  title: 10%物料3-溶剂体积(mL)
                  description: 10%部分第3种物料的溶剂体积（mL）
                percent_10_3_liquid_material_name:
                  type: string
                  title: 10%物料3-溶剂名称
                  description: 10%部分第3种物料的溶剂名称，如 NMP
                speed:
                  type: string
                  title: 搅拌速度(rpm)
                  description: 搅拌速度（rpm），不填则默认400
                temperature:
                  type: string
                  title: 搅拌温度(℃)
                  description: 搅拌温度（℃），不填则默认40
                delay_time:
                  type: string
                  title: 搅拌时间(s)
                  description: 搅拌时间（s），默认600s
                hold_m_name:
                  type: string
                  title: 6孔板库位名称
                  description: 6孔板库位名称，如"C01"，用于查找对应的库位ID
              title: DispenStationVialFeed_Goal
            feedback:
              type: object
              additionalProperties: true
              title: DispenStationVialFeed_Feedback
            result:
              type: object
              additionalProperties: false
              properties:
                return_info:
                  type: string
              title: DispenStationVialFeed_Result
          required:
          - goal
        goal_default:
          order_name: ''
          percent_90_1_assign_material_name: ''
          percent_90_1_target_weigh: ''
          percent_90_2_assign_material_name: ''
          percent_90_2_target_weigh: ''
          percent_90_3_assign_material_name: ''
          percent_90_3_target_weigh: ''
          percent_10_1_assign_material_name: ''
          percent_10_1_target_weigh: ''
          percent_10_1_volume: ''
          percent_10_1_liquid_material_name: ''
          percent_10_2_assign_material_name: ''
          percent_10_2_target_weigh: ''
          percent_10_2_volume: ''
          percent_10_2_liquid_material_name: ''
          percent_10_3_assign_material_name: ''
          percent_10_3_target_weigh: ''
          percent_10_3_volume: ''
          percent_10_3_liquid_material_name: ''
          speed: ''
          temperature: ''
          delay_time: ''
          hold_m_name: ''
        handles: {}
        placeholder_keys: {}
        display_name: 90%10%小瓶投料(单个)
      create_diamine_solution_task:
        type: DispenStationSolnPrep
        goal:
          order_name: order_name
          material_name: material_name
          target_weigh: target_weigh
          volume: volume
          liquid_material_name: liquid_material_name
          speed: speed
          temperature: temperature
          delay_time: delay_time
          hold_m_name: hold_m_name
        feedback: {}
        result:
          return_info: return_info
        schema:
          title: DispenStationSolnPrep
          description: 创建单个二胺溶液配置任务：称量固体物料、加入溶剂并搅拌混合。批量配置请用 batch_create_diamine_solution_tasks
          type: object
          properties:
            goal:
              type: object
              additionalProperties: false
              properties:
                order_name:
                  type: string
                  title: 任务名称
                  description: 任务名称，不填则使用默认名称
                material_name:
                  type: string
                  title: 固体物料名称
                  description: 固体物料名称，必填
                target_weigh:
                  type: string
                  title: 固体目标重量(g)
                  description: 固体目标重量（g），必填
                volume:
                  type: string
                  title: 溶剂体积(mL)
                  description: 液体体积（mL），必填
                liquid_material_name:
                  type: string
                  title: 溶剂名称
                  description: 液体物料名称，如 NMP
                speed:
                  type: string
                  title: 搅拌速度(rpm)
                  description: 搅拌速度（rpm），不填则默认400
                temperature:
                  type: string
                  title: 搅拌温度(℃)
                  description: 搅拌温度（℃），不填则默认20
                delay_time:
                  type: string
                  title: 搅拌时间(s)
                  description: 搅拌时间（s），默认600s
                hold_m_name:
                  type: string
                  title: 烧杯库位名称
                  description: 烧杯库位名称，如"ODA-1"，用于查找对应的库位ID
              title: DispenStationSolnPrep_Goal
            feedback:
              type: object
              additionalProperties: true
              title: DispenStationSolnPrep_Feedback
            result:
              type: object
              additionalProperties: false
              properties:
                return_info:
                  type: string
              title: DispenStationSolnPrep_Result
          required:
          - goal
        goal_default:
          order_name: ''
          material_name: ''
          target_weigh: ''
          volume: ''
          liquid_material_name: ''
          speed: ''
          temperature: ''
          delay_time: ''
          hold_m_name: ''
        handles: {}
        placeholder_keys: {}
        display_name: 二胺配液(单个)
      scheduler_start:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: scheduler_start参数
          description: 启动调度器 - 启动Bioyond配液站的任务调度器，开始执行队列中的任务
          type: object
          properties:
            goal:
              type: object
              properties: {}
              required: []
            feedback: {}
            result:
              type: object
              title: scheduler_start结果
          required:
          - goal
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        display_name: 启动调度器
      transfer_materials_to_reaction_station:
        type: UniLabJsonCommand
        goal:
          target_device_id: target_device_id
          transfer_groups: transfer_groups
        feedback: {}
        result: {}
        schema:
          title: transfer_materials_to_reaction_station参数
          description: 将配液站完成的物料（溶液、样品等）转移到指定反应站的堆栈库位。支持配置多组转移任务，每组包含物料名称、目标堆栈和目标库位。
          type: object
          properties:
            goal:
              type: object
              properties:
                target_device_id:
                  type: string
                  title: 目标反应站
                  description: 目标反应站设备ID(所有转移组使用同一个设备)
                transfer_groups:
                  type: array
                  title: 转移任务组
                  description: 转移任务组列表，每组包含 materials(物料名称)、target_stack(目标堆栈，如"堆栈1左")、target_sites(目标库位，如"A01")
              required:
              - target_device_id
              - transfer_groups
            feedback: {}
            result:
              type: object
          required:
          - goal
        goal_default:
          target_device_id: null
          transfer_groups: null
        handles: {}
        placeholder_keys:
          target_device_id: unilabos_devices
        display_name: 物料转移到反应站
      wait_for_multiple_orders_and_get_reports:
        type: UniLabJsonCommand
        goal:
          batch_create_result: batch_create_result
          check_interval: check_interval
          timeout: timeout
        feedback: {}
        result: {}
        schema:
          title: wait_for_multiple_orders_and_get_reports参数
          description: 同时等待多个任务完成并获取所有实验报告。从上游batch_create任务接收包含order_codes和order_ids的结果对象，并行监控所有任务状态并返回每个任务的报告。
          type: object
          properties:
            goal:
              type: object
              properties:
                batch_create_result:
                  type: string
                  title: 批量任务结果
                  description: 批量创建任务的返回结果对象，包含order_codes和order_ids数组。从上游batch_create节点通过handle传递
                timeout:
                  type: integer
                  default: 7200
                  title: 超时时间(秒)
                  description: 等待超时时间（秒），默认7200秒（2小时）。超过此时间未完成的任务将标记为timeout
                check_interval:
                  type: integer
                  default: 10
                  title: 检查间隔(秒)
                  description: 检查任务状态的时间间隔（秒），默认每10秒检查一次所有待完成任务
              required: []
              title: WaitForMultipleOrdersAndGetReports_Goal
            feedback:
              title: WaitForMultipleOrdersAndGetReports_Feedback
            result:
              type: object
              title: WaitForMultipleOrdersAndGetReports_Result
          required:
          - goal
        goal_default:
          batch_create_result: null
          timeout: 7200
          check_interval: 10
        handles:
          input:
          - data_key: batch_create_result
            data_source: handle
            data_type: string
            handler_key: BATCH_CREATE_RESULT
            io_type: source
            label: 批量任务结果（来自批量配液/投料）
          output:
          - data_key: return_info
            data_source: handle
            data_type: string
            handler_key: batch_reports_result
            io_type: sink
            label: 批量任务报告（→反应站「【配液联动】提取实际加料量」）
        placeholder_keys: {}
        display_name: 等待任务完成并获取报告
    module: unilabos.devices.workstation.bioyond_studio.dispensing_station.dispensing_station:BioyondDispensingStation
    status_types: {}
    type: python
  config_info: []
  description: ''
  handles: []
  icon: preparation_station.webp
  init_param_schema:
    config:
      type: object
      properties:
        config:
