reaction_station.bioyond:
  category:
  - work_station
  - reaction_station_bioyond
  class:
    action_value_mappings:
      add_time_constraint:
        display_name: 添加时间约束
        feedback: {}
        goal:
          duration: duration
          end_point: end_point
          end_step_key: end_step_key
          start_point: start_point
          start_step_key: start_step_key
        goal_default:
          duration: null
          end_point: 0
          end_step_key: ''
          start_point: 0
          start_step_key: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 添加时间约束 - 在两个工作流之间添加时间约束
          properties:
            feedback: {}
            goal:
              properties:
                duration:
                  description: 时间(秒)
                  type: integer
                end_point:
                  default: 0
                  description: 终点计时点 (Start=0, End=1)
                  type: integer
                end_step_key:
                  default: ''
                  description: 终点步骤Key (可选, 默认为空则自动选择)
                  type: string
                start_point:
                  default: 0
                  description: 起点计时点 (Start=0, End=1)
                  type: integer
                start_step_key:
                  default: ''
                  description: 起点步骤Key (可选, 默认为空则自动选择)
                  type: string
              required:
              - duration
              type: object
            result: {}
          required:
          - goal
          title: add_time_constraint参数
          type: object
        type: UniLabJsonCommand
      auto-skip_titration_steps:
        display_name: 跳过滴定步骤
        feedback: {}
        goal: {}
        goal_default:
          preintake_id: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                preintake_id:
                  description: 通量ID
                  type: string
              required:
              - preintake_id
              type: object
            result:
              type: object
          required:
          - goal
          title: skip_titration_steps参数
          type: object
        type: UniLabJsonCommand
      auto-wait_for_multiple_orders_and_get_reports:
        display_name: 等待任务完成并获取报告
        feedback: {}
        goal: {}
        goal_default:
          batch_create_result: null
          check_interval: 10
          timeout: 7200
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                batch_create_result:
                  type: string
                check_interval:
                  default: 10
                  type: integer
                timeout:
                  default: 7200
                  type: integer
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: wait_for_multiple_orders_and_get_reports参数
          type: object
        type: UniLabJsonCommand
      drip_back:
        display_name: 滴回去
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        goal_default:
          assign_material_name: null
          temperature: 25.0
          time: '90'
          titration_type: 'NO'
          torque_variation: 'YES'
          volume: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 滴回去
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称(液体种类)
                  title: 物料名称
                  type: string
                temperature:
                  default: 25.0
                  description: 温度(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '90'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                titration_type:
                  default: 'NO'
                  description: 是否滴定，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否滴定
                  type: string
                torque_variation:
                  default: 'YES'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
                volume:
                  description: 分液量(μL)
                  title: 分液量(μL)
                  type: string
              required:
              - assign_material_name
              - volume
              type: object
            result: {}
          required:
          - goal
          title: drip_back参数
          type: object
        type: UniLabJsonCommand
      extract_actuals_from_batch_reports:
        display_name: 提取实际加料量
        feedback: {}
        goal:
          batch_reports_result: batch_reports_result
        goal_default:
          batch_reports_result: null
        handles:
          input:
          - data_key: batch_reports_result
            data_source: handle
            data_type: string
            handler_key: BATCH_REPORTS_RESULT
            io_type: source
            label: Batch Order Completion Reports
          output:
          - data_key: return_info
            data_source: executor
            data_type: string
            handler_key: ACTUALS_EXTRACTED
            io_type: sink
            label: Extracted Actuals
        placeholder_keys: {}
        result: {}
        schema:
          description: 从批量任务完成报告中提取每个订单的实际加料量，输出extracted列表。
          properties:
            feedback: {}
            goal:
              properties:
                batch_reports_result:
                  description: 批量任务完成信息JSON字符串或对象，包含reports数组
                  type: string
              required:
              - batch_reports_result
              type: object
            result:
              title: extract_actuals_from_batch_reports结果
              type: object
          required:
          - goal
          title: extract_actuals_from_batch_reports参数
          type: object
        type: UniLabJsonCommand
      liquid_feeding_beaker:
        display_name: 液体进料烧杯
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        goal_default:
          assign_material_name: BAPP
          temperature: 25.0
          time: '0'
          titration_type: 'NO'
          torque_variation: 'NO'
          volume: '350'
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 液体进料烧杯
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  default: BAPP
                  description: 物料名称(试剂瓶位)
                  title: 物料名称
                  type: string
                temperature:
                  default: 25.0
                  description: 温度设定(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '0'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                titration_type:
                  default: 'NO'
                  description: 是否滴定，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否滴定
                  type: string
                torque_variation:
                  default: 'NO'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
                volume:
                  default: '350'
                  description: 分液质量(g)
                  title: 分液质量(g)
                  type: string
              required: []
              type: object
            result: {}
          required:
          - goal
          title: liquid_feeding_beaker参数
          type: object
        type: UniLabJsonCommand
      liquid_feeding_solvents:
        display_name: 液体进料-溶剂
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          solvents: solvents
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        goal_default:
          assign_material_name: null
          solvents: null
          temperature: 25.0
          time: '360'
          titration_type: 'NO'
          torque_variation: 'YES'
          volume: null
        handles:
          input:
          - data_key: solvents
            data_source: handle
            data_type: object
            handler_key: solvents
            io_type: source
            label: Solvents Data From Calculation Node
        placeholder_keys: {}
        result: {}
        schema:
          description: 液体投料-溶剂。可以直接提供volume(mL),或通过solvents对象自动从additional_solvent(mL)计算volume。
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称
                  title: 物料名称
                  type: string
                solvents:
                  description: '【可选，一般不填】溶剂信息字典或JSON字符串，由上游计算节点连线传入，

                    取其中 additional_solvent（mL）换算为μL 作为分液量'
                  title: 溶剂信息
                  type: string
                temperature:
                  default: 25.0
                  description: 温度设定(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '360'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                titration_type:
                  default: 'NO'
                  description: 是否滴定，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否滴定
                  type: string
                torque_variation:
                  default: 'YES'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
                volume:
                  description: 分液量(μL),直接指定体积(可选,如果提供solvents则自动计算)
                  title: 分液量(μL)
                  type: string
              required:
              - assign_material_name
              type: object
            result: {}
          required:
          - goal
          title: liquid_feeding_solvents参数
          type: object
        type: UniLabJsonCommand
      liquid_feeding_titration:
        display_name: 液体进料(滴定)
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          extracted_actuals: extracted_actuals
          feeding_order_data: feeding_order_data
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume_formula: volume_formula
          x_value: x_value
        goal_default:
          assign_material_name: null
          extracted_actuals: null
          feeding_order_data: null
          temperature: 25.0
          time: '90'
          titration_type: 'YES'
          torque_variation: 'YES'
          volume_formula: null
          x_value: null
        handles:
          input:
          - data_key: extracted_actuals
            data_source: handle
            data_type: string
            handler_key: ACTUALS_EXTRACTED
            io_type: source
            label: Extracted Actuals From Reports
          - data_key: feeding_order_data
            data_source: handle
            data_type: object
            handler_key: feeding_order
            io_type: source
            label: Feeding Order Data From Calculation Node
        placeholder_keys: {}
        result: {}
        schema:
          description: 液体进料(滴定)。注意：一个实验只能设置一个小瓶滴定（liquid_feeding_titration）。支持两种模式:1)直接提供volume_formula;2)自动计算-提供x_value+feeding_order_data+extracted_actuals,系统自动生成公式"1000*(m二酐-x)*V二酐滴定/m二酐滴定"
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称
                  title: 物料名称
                  type: string
                extracted_actuals:
                  description: 【可选，一般不填】从报告提取的实际加料量JSON字符串，用于自动计算公式
                  title: 实际加料量数据
                  type: string
                feeding_order_data:
                  description: 【可选，一般不填】feeding_order JSON字符串或对象，用于自动计算时获取m二酐值
                  title: 投料顺序数据
                  type: string
                temperature:
                  default: 25.0
                  description: 温度(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '90'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                titration_type:
                  default: 'YES'
                  description: 是否滴定，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否滴定
                  type: string
                torque_variation:
                  default: 'YES'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
                volume_formula:
                  description: 分液公式（ml），输入常数或公式，如"1+2*{{4-0-5}}"
                  title: 分液公式(ml)
                  type: string
                x_value:
                  description: 【可选，一般不填】自动计算公式用的x值，格式如 "1-2-3"
                  title: x值
                  type: string
              required:
              - assign_material_name
              type: object
            result: {}
          required:
          - goal
          title: liquid_feeding_titration参数
          type: object
        type: UniLabJsonCommand
      liquid_feeding_vials_non_titration:
        display_name: 液体进料小瓶(非滴定)
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume_formula: volume_formula
        goal_default:
          assign_material_name: null
          temperature: 25.0
          time: '0'
          titration_type: 'NO'
          torque_variation: 'NO'
          volume_formula: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 液体进料小瓶(非滴定)
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称
                  title: 物料名称
                  type: string
                temperature:
                  default: 25.0
                  description: 温度(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '0'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                titration_type:
                  default: 'NO'
                  description: 是否滴定，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否滴定
                  type: string
                torque_variation:
                  default: 'NO'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
                volume_formula:
                  description: 分液公式（ml），输入常数或公式，如"1+2*{{4-0-5}}"
                  title: 分液公式(ml)
                  type: string
              required:
              - volume_formula
              - assign_material_name
              type: object
            result: {}
          required:
          - goal
          title: liquid_feeding_vials_non_titration参数
          type: object
        type: UniLabJsonCommand
      process_and_execute_workflow:
        display_name: 合并并执行工作流
        feedback: {}
        goal:
          task_name: task_name
          workflow_name: workflow_name
        goal_default:
          task_name: null
          workflow_name: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 处理并执行工作流
          properties:
            feedback: {}
            goal:
              properties:
                task_name:
                  description: 任务名称
                  type: string
                workflow_name:
                  description: 合并后的工作流名称
                  type: string
              required:
              - workflow_name
              - task_name
              type: object
            result:
              type: object
          required:
          - goal
          title: process_and_execute_workflow参数
          type: object
        type: UniLabJsonCommand
      reactor_taken_in:
        display_name: 反应器放入
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          cutoff: cutoff
          temperature: temperature
        goal_default:
          assign_material_name: null
          cutoff: '900000'
          temperature: -10.0
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 反应器放入 - 将反应器放入工作站，配置物料名称、粘度上限和温度参数
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称(补充液名称，不能为空)
                  title: 物料名称
                  type: string
                cutoff:
                  default: '900000'
                  description: 粘度上限(需为有效数字字符串,默认 "900000")
                  title: 粘度上限
                  type: string
                temperature:
                  default: -10.0
                  description: 温度设定(C,范围:-50.00 至 100.00)
                  title: 温度(℃)
                  type: number
              required:
              - assign_material_name
              type: object
            result: {}
          required:
          - goal
          title: reactor_taken_in参数
          type: object
        type: UniLabJsonCommand
      reactor_taken_out:
        display_name: 反应器取出
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 反应器取出 - 从工作站中取出反应器，无需参数的简单操作
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result: {}
          required:
          - goal
          title: reactor_taken_out参数
          type: object
        type: UniLabJsonCommand
      scheduler_start:
        display_name: 启动调度器
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 启动调度器 - 启动Bioyond工作站的任务调度器，开始执行队列中的任务
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              title: scheduler_start结果
              type: object
          required:
          - goal
          title: scheduler_start参数
          type: object
        type: UniLabJsonCommand
      solid_feeding_vials:
        display_name: 固体进料小瓶
        feedback: {}
        goal:
          assign_material_name: assign_material_name
          material_id: material_id
          temperature: temperature
          time: time
          torque_variation: torque_variation
        goal_default:
          assign_material_name: null
          material_id: null
          temperature: 25.0
          time: '0'
          torque_variation: 'NO'
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 固体进料小瓶 - 通过小瓶向反应器中添加固体物料，支持多种粉末类型(盐、面粉、BTDA)
          properties:
            feedback: {}
            goal:
              properties:
                assign_material_name:
                  description: 物料名称(用于获取试剂瓶位ID)
                  title: 物料名称
                  type: string
                material_id:
                  description: 粉末类型，从下拉框选择 Salt / Flour / BTDA
                  enum:
                  - Salt
                  - Flour
                  - BTDA
                  title: 粉末类型
                  type: string
                temperature:
                  default: 25.0
                  description: 温度设定(C)
                  title: 温度(℃)
                  type: number
                time:
                  default: '0'
                  description: 观察时间(分钟)
                  title: 观察时间(分钟)
                  type: string
                torque_variation:
                  default: 'NO'
                  description: 是否观察扭矩变化，NO=否，YES=是
                  enum:
                  - 'NO'
                  - 'YES'
                  title: 是否观察
                  type: string
              required:
              - material_id
              type: object
            result: {}
          required:
          - goal
          title: solid_feeding_vials参数
          type: object
        type: UniLabJsonCommand
    module: unilabos.devices.workstation.bioyond_studio.reaction_station.reaction_station:BioyondReactionStation
    protocol_type: []
    status_types:
      workflow_sequence: str
    type: python
  config_info: []
  description: Bioyond反应站
  handles: []
  icon: reaction_station.webp
  init_param_schema:
    config:
      properties:
        config:
          description: 配置字典,应包含workflow_mappings等配置
          type: object
        deck:
          description: Deck对象
          type: string
        protocol_type:
          description: 协议类型(由ROS系统传递,此处忽略)
          type: string
      required: []
      type: object
    data:
      properties:
        workflow_sequence:
          type: string
      required:
      - workflow_sequence
      type: object
  version: 1.0.0
reaction_station.reactor:
  category:
  - reactor
  - reaction_station_bioyond
  class:
    action_value_mappings:
      auto-update_metrics:
        feedback: {}
        goal: {}
        goal_default:
          payload: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                payload:
                  type: object
              required:
              - payload
              type: object
            result: {}
          required:
          - goal
          title: update_metrics参数
          type: object
        type: UniLabJsonCommand
    module: unilabos.devices.workstation.bioyond_studio.reaction_station.reaction_station:BioyondReactor
    status_types: {}
    type: python
  config_info: []
  description: 反应站子设备-反应器
  handles: []
  icon: reaction_station.webp
  init_param_schema:
    config:
      properties:
        config:
          type: object
        deck:
          type: string
        protocol_type:
          type: string
      required: []
      type: object
    data:
      properties: {}
      required: []
      type: object
  version: 1.0.0
