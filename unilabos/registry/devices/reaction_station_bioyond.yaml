reaction_station.bioyond:
  category:
  - work_station
  - reaction_station_bioyond
  class:
    action_value_mappings:
      add_time_constraint:
        type: UniLabJsonCommand
        goal:
          duration: duration
          end_point: end_point
          end_step_key: end_step_key
          start_point: start_point
          start_step_key: start_step_key
        feedback: {}
        result: {}
        schema:
          title: add_time_constraint参数
          description: 添加时间约束 - 在两个工作流之间添加时间约束
          type: object
          properties:
            goal:
              type: object
              properties:
                duration:
                  type: integer
                  description: 时间(秒)
                start_step_key:
                  type: string
                  default: ''
                  description: 起点步骤Key (可选, 默认为空则自动选择)
                end_step_key:
                  type: string
                  default: ''
                  description: 终点步骤Key (可选, 默认为空则自动选择)
                start_point:
                  type: integer
                  default: 0
                  description: 起点计时点 (Start=0, End=1)
                end_point:
                  type: integer
                  default: 0
                  description: 终点计时点 (Start=0, End=1)
              required:
              - duration
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          duration: null
          start_step_key: ''
          end_step_key: ''
          start_point: 0
          end_point: 0
        handles: {}
        placeholder_keys: {}
        display_name: 添加时间约束
      auto-skip_titration_steps:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: skip_titration_steps参数
          description: ''
          type: object
          properties:
            goal:
              type: object
              properties:
                preintake_id:
                  type: string
                  description: 通量ID
              required:
              - preintake_id
            feedback: {}
            result:
              type: object
          required:
          - goal
        goal_default:
          preintake_id: null
        handles: {}
        placeholder_keys: {}
        display_name: 跳过滴定步骤
      drip_back:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        feedback: {}
        result: {}
        schema:
          title: drip_back参数
          description: 滴回去
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称(液体种类)
                volume:
                  type: string
                  title: 分液量(μL)
                  description: 分液量(μL)
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '90'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
              required:
              - assign_material_name
              - volume
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          volume: null
          temperature: 25.0
          titration_type: 'NO'
          torque_variation: 'YES'
          time: '90'
        handles: {}
        placeholder_keys: {}
        display_name: 滴回去
      extract_actuals_from_batch_reports:
        type: UniLabJsonCommand
        goal:
          batch_reports_result: batch_reports_result
        feedback: {}
        result: {}
        schema:
          title: extract_actuals_from_batch_reports参数
          description: 从批量任务完成报告中提取每个订单的实际加料量，输出extracted列表。
          type: object
          properties:
            goal:
              type: object
              properties:
                batch_reports_result:
                  type: string
                  description: 批量任务完成信息JSON字符串或对象，包含reports数组
              required:
              - batch_reports_result
            feedback: {}
            result:
              type: object
              title: extract_actuals_from_batch_reports结果
          required:
          - goal
        goal_default:
          batch_reports_result: null
        handles:
          input:
          - data_key: batch_reports_result
            data_source: handle
            data_type: string
            handler_key: BATCH_REPORTS_RESULT
            io_type: source
            label: 批量任务报告（来自配液站「等待任务完成」）
          output:
          - data_key: return_info
            data_source: executor
            data_type: string
            handler_key: ACTUALS_EXTRACTED
            io_type: sink
            label: 实际加料量
        placeholder_keys: {}
        display_name: 【配液联动】提取实际加料量
      liquid_feeding_beaker:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        feedback: {}
        result: {}
        schema:
          title: liquid_feeding_beaker参数
          description: 液体进料烧杯
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  default: BAPP
                  title: 烧杯名称
                  description: 烧杯名称
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度设定(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '0'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
                volume:
                  type: string
                  default: '350'
                  title: 分液质量(g)
                  description: 分液质量(g)
              required: []
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: BAPP
          temperature: 25.0
          titration_type: 'NO'
          torque_variation: 'NO'
          time: '0'
          volume: '350'
        handles: {}
        placeholder_keys: {}
        display_name: 液体进料烧杯
      liquid_feeding_solvents:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          solvents: solvents
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume: volume
        feedback: {}
        result: {}
        schema:
          title: liquid_feeding_solvents参数
          description: 液体投料-溶剂。可以直接提供volume(mL),或通过solvents对象自动从additional_solvent(mL)计算volume。
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称
                solvents:
                  type: string
                  title: 溶剂信息
                  description: 【配液联动】由配液站「计算实验设计」的溶剂信息连线传入，单独使用时不填
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度设定(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '360'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
                volume:
                  type: string
                  title: 分液量(μL)
                  description: 分液量(μL)，单独使用反应站时必填；联动配液站时留空，由溶剂信息自动计算
              required:
              - assign_material_name
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          solvents: null
          temperature: 25.0
          titration_type: 'NO'
          torque_variation: 'YES'
          time: '360'
          volume: null
        handles:
          input:
          - data_key: solvents
            data_source: handle
            data_type: object
            handler_key: solvents
            io_type: source
            label: 溶剂信息（来自配液站「计算实验设计」）
        placeholder_keys: {}
        display_name: 液体进料-溶剂
      liquid_feeding_titration:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume_formula: volume_formula
        feedback: {}
        result: {}
        schema:
          title: liquid_feeding_titration参数
          description: 液体进料(滴定)，单独使用反应站时直接填写分液公式。注意：一个实验只能设置一个小瓶滴定。联动配液站自动计算请使用「【配液联动】液体进料(滴定)」
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称
                volume_formula:
                  type: string
                  title: 分液公式(ml)
                  description: 分液公式（ml），输入常数或公式，如"1+2*{{4-0-5}}"
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '90'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
              required:
              - assign_material_name
              - volume_formula
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          volume_formula: null
          temperature: 25.0
          titration_type: 'YES'
          torque_variation: 'YES'
          time: '90'
        handles: {}
        placeholder_keys: {}
        display_name: 液体进料(滴定)
      liquid_feeding_titration_linked:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          extracted_actuals: extracted_actuals
          feeding_order_data: feeding_order_data
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          x_value: x_value
        feedback: {}
        result: {}
        schema:
          title: liquid_feeding_titration_linked参数
          description: 【配液联动】液体进料(滴定)，根据配液站的投料顺序和实际加料量自动计算分液公式 1000*(m二酐-x)*V二酐滴定/m二酐滴定，x值需手动填写。注意：一个实验只能设置一个小瓶滴定。
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称
                x_value:
                  type: string
                  title: x值
                  description: 自动计算公式中的x值，格式如 "1-2-3"，需手动填写
                feeding_order_data:
                  type: string
                  title: 投料顺序数据
                  description: 【配液联动】由配液站「计算实验设计」的投料顺序连线传入
                extracted_actuals:
                  type: string
                  title: 实际加料量数据
                  description: 【配液联动】由「提取实际加料量」连线传入
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'YES'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '90'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
              required:
              - assign_material_name
              - x_value
              - feeding_order_data
              - extracted_actuals
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          x_value: null
          feeding_order_data: null
          extracted_actuals: null
          temperature: 25.0
          titration_type: 'YES'
          torque_variation: 'YES'
          time: '90'
        handles:
          input:
          - data_key: extracted_actuals
            data_source: handle
            data_type: string
            handler_key: ACTUALS_EXTRACTED
            io_type: source
            label: 实际加料量（来自「提取实际加料量」）
          - data_key: feeding_order_data
            data_source: handle
            data_type: object
            handler_key: feeding_order
            io_type: source
            label: 投料顺序（来自配液站「计算实验设计」）
        placeholder_keys: {}
        display_name: 【配液联动】液体进料(滴定)
      liquid_feeding_vials_non_titration:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          temperature: temperature
          time: time
          titration_type: titration_type
          torque_variation: torque_variation
          volume_formula: volume_formula
        feedback: {}
        result: {}
        schema:
          title: liquid_feeding_vials_non_titration参数
          description: 液体进料小瓶(非滴定)
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称
                volume_formula:
                  type: string
                  title: 分液公式(ml)
                  description: 分液公式（ml），输入常数或公式，如"1+2*{{4-0-5}}"
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度(C)
                titration_type:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否滴定
                  description: 是否滴定，NO=否，YES=是
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '0'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
              required:
              - assign_material_name
              - volume_formula
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          volume_formula: null
          temperature: 25.0
          titration_type: 'NO'
          torque_variation: 'NO'
          time: '0'
        handles: {}
        placeholder_keys: {}
        display_name: 液体进料小瓶(非滴定)
      process_and_execute_workflow:
        type: UniLabJsonCommand
        goal:
          task_name: task_name
          workflow_name: workflow_name
        feedback: {}
        result: {}
        schema:
          title: process_and_execute_workflow参数
          description: 处理并执行工作流
          type: object
          properties:
            goal:
              type: object
              properties:
                workflow_name:
                  type: string
                  description: 合并后的工作流名称
                task_name:
                  type: string
                  description: 任务名称
              required:
              - workflow_name
              - task_name
            feedback: {}
            result:
              type: object
          required:
          - goal
        goal_default:
          workflow_name: null
          task_name: null
        handles: {}
        placeholder_keys: {}
        display_name: 合并并执行工作流
      reactor_taken_in:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          cutoff: cutoff
          temperature: temperature
        feedback: {}
        result: {}
        schema:
          title: reactor_taken_in参数
          description: 反应器放入 - 将反应器放入工作站，配置物料名称、粘度上限和温度参数
          type: object
          properties:
            goal:
              type: object
              properties:
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称(补充液名称，不能为空)
                cutoff:
                  type: string
                  default: '900000'
                  title: 粘度上限
                  description: 粘度上限(需为有效数字字符串,默认 "900000")
                temperature:
                  type: number
                  default: -10.0
                  title: 温度(℃)
                  description: 温度设定(C,范围:-50.00 至 100.00)
              required:
              - assign_material_name
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          assign_material_name: null
          cutoff: '900000'
          temperature: -10.0
        handles: {}
        placeholder_keys: {}
        display_name: 反应器放入
      reactor_taken_out:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: reactor_taken_out参数
          description: 反应器取出 - 从工作站中取出反应器，无需参数的简单操作
          type: object
          properties:
            goal:
              type: object
              properties: {}
              required: []
            feedback: {}
            result: {}
          required:
          - goal
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        display_name: 反应器取出
      scheduler_start:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: scheduler_start参数
          description: 启动调度器 - 启动Bioyond工作站的任务调度器，开始执行队列中的任务
          type: object
          properties:
            goal:
              type: object
              properties: {}
              required: []
            feedback: {}
            result:
              type: object
              title: scheduler_start结果
          required:
          - goal
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        display_name: 启动调度器
      solid_feeding_vials:
        type: UniLabJsonCommand
        goal:
          assign_material_name: assign_material_name
          material_id: material_id
          temperature: temperature
          time: time
          torque_variation: torque_variation
        feedback: {}
        result: {}
        schema:
          title: solid_feeding_vials参数
          description: 固体进料小瓶 - 通过小瓶向反应器中添加固体物料，支持多种粉末类型(盐、面粉、BTDA)
          type: object
          properties:
            goal:
              type: object
              properties:
                material_id:
                  type: string
                  enum:
                  - Salt
                  - Flour
                  - BTDA
                  title: 粉末类型
                  description: 粉末类型，从下拉框选择 Salt / Flour / BTDA
                assign_material_name:
                  type: string
                  title: 物料名称
                  description: 物料名称(用于获取试剂瓶位ID)
                temperature:
                  type: number
                  default: 25.0
                  title: 温度(℃)
                  description: 温度设定(C)
                torque_variation:
                  type: string
                  enum:
                  - 'NO'
                  - 'YES'
                  default: 'NO'
                  title: 是否观察
                  description: 是否观察，NO=否，YES=是
                time:
                  type: string
                  default: '0'
                  title: 观察时间(分钟)
                  description: 观察时间(分钟)
              required:
              - material_id
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          material_id: null
          assign_material_name: null
          temperature: 25.0
          torque_variation: 'NO'
          time: '0'
        handles: {}
        placeholder_keys: {}
        display_name: 固体进料小瓶
    module: unilabos.devices.workstation.bioyond_studio.reaction_station.reaction_station:BioyondReactionStation
    protocol_type: []
    status_types:
      workflow_sequence: str
    type: python
  config_info: []
  description: Bioyond反应站
  handles: []
  icon: reaction_station.webp
  init_param_schema:
    config:
      type: object
      properties:
        config:
          type: object
          description: 配置字典,应包含workflow_mappings等配置
        deck:
          type: string
          description: Deck对象
        protocol_type:
          type: string
          description: 协议类型(由ROS系统传递,此处忽略)
      required: []
    data:
      type: object
      properties:
        workflow_sequence:
          type: string
      required:
      - workflow_sequence
  version: 1.0.0
reaction_station.reactor:
  category:
  - reactor
  - reaction_station_bioyond
  class:
    action_value_mappings:
      auto-update_metrics:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result: {}
        schema:
          title: update_metrics参数
          description: ''
          type: object
          properties:
            goal:
              type: object
              properties:
                payload:
                  type: object
              required:
              - payload
            feedback: {}
            result: {}
          required:
          - goal
        goal_default:
          payload: null
        handles: {}
        placeholder_keys: {}
    module: unilabos.devices.workstation.bioyond_studio.reaction_station.reaction_station:BioyondReactor
    status_types: {}
    type: python
  config_info: []
