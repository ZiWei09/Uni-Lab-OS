# Humble variant of unilabos-env. Keep this package in an environment that
# only enables robostack-humble; ROS distro mutexes intentionally conflict.

package:
  name: unilabos-env
  version: 0.12.2

build:
  noarch: generic
  number: 0
  string: humble_0

requirements:
  run:
  - zstd
  - zstandard
  - conda-forge::python ==3.12.13
  - conda-forge::numpy >=2,<3
  - uni-lab::opentrons-shared-data ==9.1.0+unilabos.np2.1 py312_np2_1
  - conda-forge::opencv
  - robostack-humble::ros2-distro-mutex 0.9.* humble_*
  - robostack-humble::ros-humble-ros-core
  - robostack-humble::ros-humble-action-msgs
  - robostack-humble::ros-humble-std-msgs
  - robostack-humble::ros-humble-geometry-msgs
  - robostack-humble::ros-humble-control-msgs
  - robostack-humble::ros-humble-nav2-msgs
  - robostack-humble::ros-humble-cv-bridge
  - robostack-humble::ros-humble-vision-opencv
  - robostack-humble::ros-humble-tf-transformations
  - robostack-humble::ros-humble-moveit-msgs
  - robostack-humble::ros-humble-tf2-ros
  - robostack-humble::ros-humble-tf2-ros-py
  - conda-forge::transforms3d
  - conda-forge::uv
  - uni-lab::ros-humble-unilabos-msgs ==0.12.1

about:
  repository: https://github.com/deepmodeling/Uni-Lab-OS
  license: GPL-3.0-only
  description: "UniLabOS Environment - ROS 2 Humble, CPython 3.12, and NumPy 2"
