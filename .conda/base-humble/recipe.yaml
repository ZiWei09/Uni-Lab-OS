# Humble build variant of the production package.

package:
  name: unilabos
  version: 0.12.2

source:
  path: ../../unilabos
  target_directory: unilabos

build:
  number: 0
  string: humble_0
  python:
    entry_points:
    - unilab = unilabos.app.main:main
  script:
  - set PIP_NO_INDEX=
  - if: win
    then:
    - copy %RECIPE_DIR%\..\..\MANIFEST.in %SRC_DIR%
    - copy %RECIPE_DIR%\..\..\setup.cfg %SRC_DIR%
    - copy %RECIPE_DIR%\..\..\setup.py %SRC_DIR%
    - pip install %SRC_DIR%
  - if: unix
    then:
    - cp $RECIPE_DIR/../../MANIFEST.in $SRC_DIR
    - cp $RECIPE_DIR/../../setup.cfg $SRC_DIR
    - cp $RECIPE_DIR/../../setup.py $SRC_DIR
    - pip install $SRC_DIR

requirements:
  host:
  - python ==3.12.13
  - pip
  - setuptools
  - zstd
  - zstandard
  run:
  - python >=3.12,<3.13
  - zstd
  - zstandard
  - networkx
  - typing_extensions
  - websockets
  - pint
  - fastapi
  - jinja2
  - requests
  - uvicorn
  - if: not osx
    then:
    - opcua
  - pyserial
  - pandas
  - pymodbus
  - matplotlib
  - pylibftdi
  - unilabos-env ==0.12.2 humble_0

about:
  repository: https://github.com/deepmodeling/Uni-Lab-OS
  license: GPL-3.0-only
  description: "UniLabOS - Production package for ROS 2 Humble and CPython 3.12"
