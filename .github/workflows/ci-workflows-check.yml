name: CI Workflow Contracts

on:
  pull_request:
    branches: [main, dev]
    paths: ['.github/workflows/**', '.github/tests/**']
  push:
    branches: [main, dev]
    paths: ['.github/workflows/**', '.github/tests/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck='' -pyflakes='' .github/workflows/multi-platform-build.yml .github/workflows/unilabos-conda-build.yml .github/workflows/conda-pack-build.yml .github/workflows/ci-workflows-check.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test build provenance and no-op handling
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s .github/tests -v

